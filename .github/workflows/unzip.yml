
name: Auto Unzip to Root

on:
  push:
    paths:
      - '**.zip'
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP without folder
        run: |
          shopt -s globstar nullglob

          for f in **/*.zip; do
            unzip -o "$f" -d .
          done

      - name: Delete ZIP files
        run: |
          find . -type f -name "*.zip" \
            -not -path "./.git/*" -delete

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract ZIP to root"
            git push
          fi
