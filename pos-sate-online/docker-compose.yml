# Jalankan: docker compose up -d --build
# Caddy otomatis mengurus HTTPS (sertifikat gratis) untuk domain Anda.
services:
  pos:
    build: .
    restart: unless-stopped
    environment:
      POS_PASSWORD: ${POS_PASSWORD:-}          # dipakai sekali untuk membuat akun owner pertama (username: owner)
      RESET_OWNER_PASSWORD: ${RESET_OWNER_PASSWORD:-}  # isi 1 hanya untuk memulihkan sandi owner
      TRUST_PROXY: "1"                      # baca IP asli pelanggan dari Caddy (untuk batas laju)
      STORE_TZ: ${STORE_TZ:-Asia/Jakarta}   # zona waktu toko: nomor antrean pesanan reset tiap hari
    volumes:
      - pos-data:/data        # database SQLite + backup harian ada di sini
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pos

volumes:
  pos-data:
  caddy-data:
  caddy-config:
